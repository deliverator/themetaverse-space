<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>themetaverse.space</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene background="color: #000" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true">

    <!-- THE STREET
         100m wide along X, extends 2000m along Z. Lies in the XZ plane (rotated -90° on X).
         Coordinate system: decisions/0001. Origin (0,0,0) = Black Sun. -->
    <a-entity id="street"
              geometry="primitive: plane; width: 100; height: 2000"
              material="color: #0a0a0a; emissive: #0a0a0a; emissiveIntensity: 0.4"
              rotation="-90 0 0"
              position="0 0 0"></a-entity>

    <!-- Center median: magenta neon strip down the centerline -->
    <a-entity geometry="primitive: plane; width: 0.5; height: 2000"
              material="color: #ff00ff; emissive: #ff00ff; emissiveIntensity: 1.5"
              rotation="-90 0 0"
              position="0 0.01 0"></a-entity>

    <!-- Edge strips: cyan glow at Street boundaries (x = ±50) -->
    <a-entity geometry="primitive: plane; width: 0.6; height: 2000"
              material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1.5"
              rotation="-90 0 0"
              position="-50 0.01 0"></a-entity>
    <a-entity geometry="primitive: plane; width: 0.6; height: 2000"
              material="color: #00ffff; emissive: #00ffff; emissiveIntensity: 1.5"
              rotation="-90 0 0"
              position="50 0.01 0"></a-entity>

    <!-- THE BLACK SUN
         Locked. Unexplained. East side parcel so the Street stays walkable past it. -->
    <a-entity id="black-sun"
              geometry="primitive: box; width: 30; height: 30; depth: 30"
              material="color: #000000; metalness: 0; roughness: 1"
              position="80 15 -50">
      <a-entity geometry="primitive: box; width: 30.05; height: 30.05; depth: 30.05"
                material="color: #1a0033; emissive: #4a0099; emissiveIntensity: 0.8; wireframe: true"></a-entity>
    </a-entity>

    <!-- Camera rig at avatar height. Spawn 50m down the Street, facing the Black Sun. -->
    <a-entity id="rig" position="0 1.7 50">
      <a-camera wasd-controls="acceleration: 30" look-controls="pointerLockEnabled: false; reverseMouseDrag: true"></a-camera>
    </a-entity>

    <!-- Minimal ambient so emissives have a baseline to read against -->
    <a-light type="ambient" color="#0a0a0a" intensity="0.2"></a-light>

  </a-scene>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>themetaverse.space</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
            color: #4a4a58; font: 13px ui-sans-serif, system-ui, sans-serif;
            pointer-events: none; letter-spacing: 0.5px; }
  </style>
  <script>
    AFRAME.registerComponent('gradient-sky', {
      schema: { horizon:{type:'color',default:'#243766'}, mid:{type:'color',default:'#0d1428'}, zenith:{type:'color',default:'#020205'} },
      init: function () {
        var d=this.data;
        var mat=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false,
          uniforms:{ horizon:{value:new THREE.Color(d.horizon)}, mid:{value:new THREE.Color(d.mid)}, zenith:{value:new THREE.Color(d.zenith)} },
          vertexShader:'varying vec3 vDir; void main(){ vDir=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
          fragmentShader:'varying vec3 vDir; uniform vec3 horizon; uniform vec3 mid; uniform vec3 zenith; void main(){ float h=clamp(vDir.y,0.0,1.0); vec3 lower=mix(horizon,mid,smoothstep(0.0,0.28,h)); vec3 col=mix(lower,zenith,smoothstep(0.18,0.85,h)); gl_FragColor=vec4(col,1.0); }'
        });
        var mesh=new THREE.Mesh(new THREE.SphereGeometry(6000,48,24),mat); mesh.frustumCulled=false;
        this.el.setObject3D('mesh',mesh);
      }
    });

    // ECLIPSE: black disc + camera-facing billboard, angular-noise corona all the way round.
    AFRAME.registerComponent('eclipse', {
      schema:{ radius:{default:115}, color:{type:'color',default:'#ffcaa0'}, diamond:{default:0.0} },
      init: function () {
        var r=this.data.radius;
        var grp=new THREE.Group();

        var disc=new THREE.Mesh(
          new THREE.CircleGeometry(r,96),
          new THREE.MeshBasicMaterial({color:0x000000})
        );
        grp.add(disc);

        var size=r*6.0;
        this.mat=new THREE.ShaderMaterial({
          transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
          uniforms:{
            uTime:{value:0},
            uLimb:{value:(r/size)*2.0},
            uColor:{value:new THREE.Color(this.data.color)},
            uDiamondI:{value:this.data.diamond}
          },
          vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
          fragmentShader:
            'precision highp float; varying vec2 vUv;'+
            'uniform float uTime,uLimb,uDiamondI; uniform vec3 uColor;'+
            'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
            'float noise(vec2 p){vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);'+
            ' return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);}'+
            'float fbm(vec2 p){float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*noise(p); p*=2.03; a*=0.5;} return v;}'+
            'void main(){'+
            ' vec2 p=vUv*2.0-1.0; float rr=length(p); float th=atan(p.y,p.x);'+
            ' if(rr<uLimb) discard;'+
            ' float ring=smoothstep(uLimb+0.018,uLimb+0.001,rr);'+
            ' float low=fbm(vec2(th*3.0, rr*2.5+uTime*0.02));'+
            ' float high=fbm(vec2(th*12.0, rr*8.0-uTime*0.05));'+
            ' float streamers=pow(mix(low,high,0.5),1.7);'+
            ' float falloff=exp(-(rr-uLimb)*4.5);'+
            ' float corona=streamers*falloff; float edgeFade=1.0-smoothstep(0.7,1.0,rr); corona*=edgeFade; ring*=edgeFade;'+
            ' vec3 col=uColor*(ring*1.2+corona*1.5);'+
            ' gl_FragColor=vec4(col,1.0);'+
            '}'
        });
        var bill=new THREE.Mesh(new THREE.PlaneGeometry(size,size),this.mat);
        bill.renderOrder=10; this.bill=bill;
        grp.add(bill);
        this.el.setObject3D('mesh',grp);
      },
      tick:function(t){
        var cam=this.el.sceneEl.camera;
        if(cam&&this.bill) this.bill.quaternion.copy(cam.quaternion);
        if(this.mat) this.mat.uniforms.uTime.value=t/1000;
      }
    });

    AFRAME.registerComponent('dashed-line', {
      schema:{ color:{type:'color',default:'#ff1ad0'}, repeat:{default:300} },
      init:function(){
        var c=document.createElement('canvas'); c.width=8; c.height=128;
        var ctx=c.getContext('2d'); ctx.clearRect(0,0,8,128);
        ctx.fillStyle=this.data.color; ctx.fillRect(0,30,8,68);
        var tex=new THREE.CanvasTexture(c);
        tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,this.data.repeat);
        tex.generateMipmaps=true; tex.minFilter=THREE.LinearMipmapLinearFilter; tex.magFilter=THREE.LinearFilter; tex.anisotropy=16;
        var self=this;
        var apply=function(m){ m.material=new THREE.MeshBasicMaterial({ map:tex, transparent:true, color:new THREE.Color(self.data.color), depthWrite:false }); };
        var mesh=this.el.getObject3D('mesh');
        if(mesh) apply(mesh);
        else this.el.addEventListener('object3dset',function(e){ if(e.detail.type==='mesh') apply(self.el.getObject3D('mesh')); });
      }
    });

    AFRAME.registerComponent('tap-walk', {
      schema:{ speed:{default:14} },
      init:function(){
        this.walking=false; this.dragged=false; this.dir=new THREE.Vector3();
        var self=this, down={x:0,y:0};
        window.addEventListener('pointerdown',function(e){ down.x=e.clientX||0; down.y=e.clientY||0; self.dragged=false; });
        window.addEventListener('pointermove',function(e){ if(e.buttons||(e.touches&&e.touches.length)){ var dx=(e.clientX||0)-down.x, dy=(e.clientY||0)-down.y; if(Math.abs(dx)+Math.abs(dy)>8) self.dragged=true; } });
        window.addEventListener('pointerup',function(){ if(self.dragged) return; self.walking=!self.walking; self.hint(); });
        this.hint();
      },
      hint:function(){ var h=document.getElementById('hint'); if(h) h.textContent=this.walking?'walking — tap to stop · drag to turn':'tap to walk · drag to look'; },
      tick:function(t,dt){
        if(!this.walking||!dt) return;
        var cam=this.el.querySelector('a-camera')||this.el;
        cam.object3D.getWorldDirection(this.dir); this.dir.y=0; this.dir.normalize();
        var step=this.data.speed*(dt/1000);
        this.el.object3D.position.addScaledVector(this.dir,-step);
        var x=this.el.object3D.position.x;
        this.el.object3D.position.x = x - x*Math.min(1,(dt/1000)*2.5);
      }
    });

    AFRAME.registerComponent('horizon-lock', {
      schema:{ distance:{default:1200} },
      tick:function(){ var rig=document.querySelector('#rig'); if(!rig) return; this.el.object3D.position.z=rig.object3D.position.z-this.data.distance; }
    });
  </script>
</head>
<body>
  <a-scene background="color: #000"
           bloom="threshold: 0.85; strength: 0.7; radius: 0.8"
           renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic">

    <a-entity gradient-sky></a-entity>

    <a-entity geometry="primitive: plane; width: 100; height: 12000"
              material="color: #0a0a0a; emissive: #0a0a0a; emissiveIntensity: 0.4"
              rotation="-90 0 0" position="0 0 0"></a-entity>
    <a-entity geometry="primitive: plane; width: 0.4; height: 12000"
              rotation="-90 0 0" position="0 0.05 0"
              dashed-line="color: #00ff66; repeat: 300"></a-entity>
    <a-entity geometry="primitive: plane; width: 1.2; height: 12000"
              material="color: #00cfe6; emissive: #00cfe6; emissiveIntensity: 1.3; shader: flat"
              rotation="-90 0 0" position="-50 0.05 0"></a-entity>
    <a-entity geometry="primitive: plane; width: 1.2; height: 12000"
              material="color: #00cfe6; emissive: #00cfe6; emissiveIntensity: 1.3; shader: flat"
              rotation="-90 0 0" position="50 0.05 0"></a-entity>

    <!-- THE BLACK SUN. Eclipse raised high so the full disc + corona clear horizon and base.
         Base reduced to a slim foot so it doesn't clip the lower corona. -->
    <a-entity id="black-sun" position="0 0 -1150" horizon-lock="distance: 1200">
      <a-entity eclipse position="0 57 0"></a-entity>
    </a-entity>

    <a-entity id="rig" position="0 1.7 50" tap-walk="speed: 14">
      <a-camera wasd-controls="acceleration: 30" look-controls="pointerLockEnabled: false; reverseMouseDrag: true"></a-camera>
    </a-entity>

    <a-light type="ambient" color="#0a0a0a" intensity="0.2"></a-light>
  </a-scene>
  <div id="hint">tap to walk · drag to look</div>
</body>
</html>
